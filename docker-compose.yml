services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bioecos
      POSTGRES_USER: bioecos
      POSTGRES_PASSWORD: ${BIOECOS_DB_PASSWORD:?Defina BIOECOS_DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bioecos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioecos -d bioecos"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bioecos_postgres:


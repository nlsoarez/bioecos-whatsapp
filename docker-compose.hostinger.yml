name: bioecos

services:
  bioecos-volume-init:
    image: node:24.18.0-alpine3.23@sha256:595398b0081eacda8e1c4c5b97b76cd1020e4d58a8ebcb4843b9bca1e79e7436
    container_name: bioecos-volume-init
    restart: "no"
    network_mode: none
    command: ["/bin/sh", "-ec", "chown -R 1000:1000 /config-data && chown -R 70:70 /backups"]
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - bioecos_config_data:/config-data
      - bioecos_backup_data:/backups

  bioecos-postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    container_name: bioecos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bioecos
      POSTGRES_USER: bioecos
      POSTGRES_PASSWORD: ${BIOECOS_DB_PASSWORD:?Defina BIOECOS_DB_PASSWORD}
    volumes:
      - bioecos_postgres_data:/var/lib/postgresql/data
    networks:
      - bioecos_internal
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioecos -d bioecos"]
      interval: 10s
      timeout: 5s
      retries: 12

  bioecos-api:
    image: ${BIOECOS_API_IMAGE:-bioecos-whatsapp:0.2.1-security}
    pull_policy: never
    container_name: bioecos-api
    restart: unless-stopped
    user: "1000:1000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    depends_on:
      bioecos-postgres:
        condition: service_healthy
      bioecos-volume-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    volumes:
      - bioecos_config_data:/app/config-data
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      ADMIN_CORS_ORIGINS: https://nlsoarez.github.io
      DASHBOARD_USERNAME: ${BIOECOS_DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${BIOECOS_DASHBOARD_PASSWORD:?Defina BIOECOS_DASHBOARD_PASSWORD}
      DASHBOARD_SESSION_SECRET: ${BIOECOS_DASHBOARD_SESSION_SECRET:?Defina BIOECOS_DASHBOARD_SESSION_SECRET}
      DASHBOARD_SESSION_TTL_MINUTES: 60
      RUNTIME_SECRETS_PATH: /app/config-data/runtime-secrets.json
      DATABASE_URL: postgresql://bioecos:${BIOECOS_DB_PASSWORD}@bioecos-postgres:5432/bioecos
      DATABASE_SSL: "false"
      BIOECOS_SITE_URL: https://www.bioecoscursos.com.br/
      INTEGRAL_GIFT_ENABLED: "false"
      AUTOMATION_TIMEZONE: America/Sao_Paulo
      AUTOMATION_START_HOUR: 0
      AUTOMATION_END_HOUR: 24
      FOLLOWUP_WORKER_INTERVAL_MS: 300000
      WEBHOOK_WORKER_INTERVAL_MS: 2000
      OPENAI_HEALTH_INTERVAL_MS: 3600000
      DATA_RETENTION_DAYS: ${BIOECOS_DATA_RETENTION_DAYS:-365}
      AI_PROVIDER: openai
      AI_MODEL: gpt-4.1-mini
      AI_EMBEDDING_MODEL: text-embedding-3-small
      OPENAI_API_KEY: ${BIOECOS_OPENAI_API_KEY:-}
      OPENAI_BASE_URL: https://api.openai.com/v1
      PUBLIC_API_URL: https://evolution.179-198-124-8.sslip.io/bioecos
      EVOLUTION_API_VERSION: 2
      EVOLUTION_API_URL: https://evolution.179-198-124-8.sslip.io
      EVOLUTION_API_KEY: ${BIOECOS_EVOLUTION_API_KEY:?Defina BIOECOS_EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${BIOECOS_EVOLUTION_INSTANCE_NAME:?Defina BIOECOS_EVOLUTION_INSTANCE_NAME}
      EVOLUTION_WEBHOOK_SECRET: ${BIOECOS_EVOLUTION_WEBHOOK_SECRET:?Defina BIOECOS_EVOLUTION_WEBHOOK_SECRET}
      EVOLUTION_REQUEST_TIMEOUT_MS: 10000
      EVOLUTION_MAX_RETRIES: 3
      ADMIN_API_KEY: ${BIOECOS_ADMIN_API_KEY:?Defina BIOECOS_ADMIN_API_KEY}
      PII_ENCRYPTION_KEY: ${BIOECOS_PII_ENCRYPTION_KEY:?Defina BIOECOS_PII_ENCRYPTION_KEY}
      DASHBOARD_PUBLIC_URL: https://nlsoarez.github.io/bioecos-whatsapp/
    networks:
      - bioecos_internal
      - bioecos_edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  bioecos-backup:
    image: ${BIOECOS_BACKUP_IMAGE:-bioecos-backup:0.2.1-security}
    pull_policy: never
    container_name: bioecos-backup
    restart: unless-stopped
    user: "70:70"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      bioecos-postgres:
        condition: service_healthy
      bioecos-volume-init:
        condition: service_completed_successfully
    environment:
      PGHOST: bioecos-postgres
      PGPORT: 5432
      PGDATABASE: bioecos
      PGUSER: bioecos
      PGPASSWORD: ${BIOECOS_DB_PASSWORD:?Defina BIOECOS_DB_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BIOECOS_BACKUP_RETENTION_DAYS:-14}
      BACKUP_ENCRYPTION_KEY: ${BIOECOS_BACKUP_ENCRYPTION_KEY:?Defina BIOECOS_BACKUP_ENCRYPTION_KEY}
      GNUPGHOME: /tmp/gnupg
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          temporary="/backups/.bioecos-$${stamp}.dump"
          encrypted="/backups/bioecos-$${stamp}.dump.gpg"
          pg_dump --format=custom --file="$${temporary}"
          pg_restore --list "$${temporary}" >/dev/null
          mkdir -p "$${GNUPGHOME}" && chmod 700 "$${GNUPGHOME}"
          printf '%s' "$${BACKUP_ENCRYPTION_KEY}" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 --compress-algo none \
            --output "$${encrypted}" "$${temporary}"
          sha256sum "$${encrypted}" > "$${encrypted}.sha256"
          rm -f "$${temporary}"
          find /backups -type f \( -name 'bioecos-*.dump.gpg' -o -name 'bioecos-*.dump.gpg.sha256' \) \
            -mtime +$${BACKUP_RETENTION_DAYS} -delete
          sleep 86400
        done
    volumes:
      - bioecos_backup_data:/backups
    networks:
      - bioecos_internal

networks:
  bioecos_internal:
    name: bioecos_internal
    internal: true
  bioecos_edge:
    external: true
    name: comunora-edge

volumes:
  bioecos_postgres_data:
    name: bioecos_postgres_data
  bioecos_config_data:
    name: bioecos_config_data
  bioecos_backup_data:
    name: bioecos_backup_data

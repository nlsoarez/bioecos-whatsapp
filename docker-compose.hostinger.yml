name: bioecos

services:
  bioecos-postgres:
    image: pgvector/pgvector:pg16
    container_name: bioecos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bioecos
      POSTGRES_USER: bioecos
      POSTGRES_PASSWORD: ${BIOECOS_DB_PASSWORD:?Defina BIOECOS_DB_PASSWORD}
    volumes:
      - bioecos_postgres_data:/var/lib/postgresql/data
    networks:
      - bioecos_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioecos -d bioecos"]
      interval: 10s
      timeout: 5s
      retries: 12

  bioecos-api:
    image: node:22-alpine
    container_name: bioecos-api
    restart: unless-stopped
    working_dir: /app/source
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache git
        if [ ! -d /app/source/.git ]; then
          git clone --depth 1 --branch main https://github.com/nlsoarez/bioecos-whatsapp.git /app/source
        fi
        npm ci --include=dev
        npm run build
        cp -R src/db/migrations dist/src/db/migrations
        npm prune --omit=dev
        npm run start:docker
    depends_on:
      bioecos-postgres:
        condition: service_healthy
    ports:
      - "3100:3000"
    volumes:
      - bioecos_config_data:/app/config-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      ADMIN_CORS_ORIGINS: https://nlsoarez.github.io
      DASHBOARD_USERNAME: ${BIOECOS_DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${BIOECOS_DASHBOARD_PASSWORD:?Defina BIOECOS_DASHBOARD_PASSWORD}
      DASHBOARD_SESSION_SECRET: ${BIOECOS_DASHBOARD_SESSION_SECRET:?Defina BIOECOS_DASHBOARD_SESSION_SECRET}
      DASHBOARD_SESSION_TTL_MINUTES: 480
      RUNTIME_SECRETS_PATH: /app/config-data/runtime-secrets.json
      DATABASE_URL: postgresql://bioecos:${BIOECOS_DB_PASSWORD}@bioecos-postgres:5432/bioecos
      DATABASE_SSL: "false"
      BIOECOS_SITE_URL: https://www.bioecoscursos.com.br/
      INTEGRAL_GIFT_ENABLED: "false"
      AUTOMATION_TIMEZONE: America/Sao_Paulo
      AUTOMATION_START_HOUR: 0
      AUTOMATION_END_HOUR: 24
      AUTOMATION_MODE: hybrid
      FOLLOWUP_WORKER_INTERVAL_MS: 300000
      AI_PROVIDER: openai
      AI_MODEL: gpt-4.1-mini
      AI_EMBEDDING_MODEL: text-embedding-3-small
      OPENAI_API_KEY: ${BIOECOS_OPENAI_API_KEY:-}
      OPENAI_BASE_URL: https://api.openai.com/v1
      PUBLIC_API_URL: https://evolution.179-198-124-8.sslip.io/bioecos
      EVOLUTION_API_VERSION: 2
      EVOLUTION_API_URL: https://evolution.179-198-124-8.sslip.io
      EVOLUTION_API_KEY: ${BIOECOS_EVOLUTION_API_KEY:?Defina BIOECOS_EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${BIOECOS_EVOLUTION_INSTANCE_NAME:?Defina BIOECOS_EVOLUTION_INSTANCE_NAME}
      EVOLUTION_WEBHOOK_SECRET: ${BIOECOS_EVOLUTION_WEBHOOK_SECRET:?Defina BIOECOS_EVOLUTION_WEBHOOK_SECRET}
      EVOLUTION_REQUEST_TIMEOUT_MS: 10000
      EVOLUTION_MAX_RETRIES: 3
      ADMIN_API_KEY: ${BIOECOS_ADMIN_API_KEY:?Defina BIOECOS_ADMIN_API_KEY}
      PII_ENCRYPTION_KEY: ${BIOECOS_PII_ENCRYPTION_KEY:?Defina BIOECOS_PII_ENCRYPTION_KEY}
    networks:
      - bioecos_internal
      - bioecos_edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  bioecos_internal:
    name: bioecos_internal
  bioecos_edge:
    external: true
    name: comunora-edge

volumes:
  bioecos_postgres_data:
    name: bioecos_postgres_data
  bioecos_config_data:
    name: bioecos_config_data
